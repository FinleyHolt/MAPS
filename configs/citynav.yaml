# CityNav: the benchmark default config (launch.py DEFAULT_CONFIG and
# bench_fullset CONFIG).
#
# Eval protocol: the upstream CityNav scoring (water-cookie/citynav,
# gsamllavanav, Lee et al. arXiv 2406.14240): NE/SR/OSR in 2D world metres
# (SR = ||pred_xy - target_xy|| <= 20 m), the 100-150 m start altitude band
# sampled per episode from the episode id, a 200 m altitude ceiling, and the
# six-action alphabet (move_forward 5 m, turn +-30 deg, ascend/descend 2 m,
# stop). SPL rides as spl_pos: Anderson over the flown xy path.
#
# Observation: the hole-free 2D ortho cropped over the altitude-driven view
# square (maps.perception.observation.crop_ortho_observation): side =
# 2 * (altitude - GROUND_LEVEL[map]), depth = altitude - height. The ortho is
# built and interior-filled from the 0.1 m/px rasters under
# SEARCH_CITYNAV_RGBD_DIR (default $CITYNAV_ROOT/data/rgbd_upstream). Scoring
# is independent of the observation pixels.
#
# Priors: the OSM tile bake under SEARCH_CITYNAV_TILES.
perception: sam
# Primitive actions. 200 is GeoNav's published budget (arXiv 2504.09587 SS3);
# the upstream budget is 100 (eval_max_timestep=20 x move_iteration=5).
max_steps: 200
# Inert on this backend (the view square is altitude-driven); required key.
fov_m: 0.0
# Inert fallback: the start altitude is sampled from the 100-150 m band.
altitude_m: 125.0
cell_size_m: 2.0
success_radius_m: 20.0
# Model-input resolution: the native-resolution crop is resampled to this
# size, and the reasoner and SAM consume this one frame. SAHI tiles it into
# 1008 px crops fed to SAM 1:1.
rgb_upscale_px: 2016
sam:
  model_id: facebook/sam3.1
  # CityNav birmingham/cambridge perceived-color calibration
  # (perception._COLOR_PALETTES). Other cameras: omit (ideal sRGB).
  color_palette: citynav
  device: cuda
  dtype: bfloat16
  score_threshold: 0.3
  min_area_px: 32
  # A backstop against a pathological frame, not a budget: there is no
  # per-concept cap, so every same-class instance stays available for
  # relational and ordinal counting.
  max_per_step: 1024
  # Native-resolution SAHI tiling of the 2016 px render into 1008 px tiles,
  # masks remapped to the full frame, cross-tile IoU-NMS dedup.
  sahi: true
  sahi_overlap: 0.2
  sahi_nms_iou: 0.5
sensor: nadir_1008_90
# The action-space model. The CityNav six-action alphabet is what a submitted
# trajectory is read in, so it is a contract on this config.
flight_model:
  kind: discrete6
  camera_hz: 5.0
descent_step_m: 5.0
landing_altitude_m: 5.0
altitude_tolerance_m: 1.0
landing_xy_tolerance_m: 5.0
# Compaction budgets derive from the served window discovered off the live
# endpoint's /v1/models at startup (maps.llm.endpoint_spec).
compact:
  enable: true

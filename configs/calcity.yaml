# Cal City: the same flight and eval contract as citynav.yaml over a 2D world
# of California City, CA: the block's raster (SEARCH_CALCITY_RGBD_DIR) on a
# flat height plane (GROUND_LEVEL = 0.0, so pose.z reads as AGL), the OSM
# tile bake (SEARCH_CALCITY_TILES) and the authored corpus
# (benchmarks/calcity/data). Success is landing inside the target's own
# annotated footprint (the "shape" criterion, benchmarks/citynav/paths.py).
#
# Observation: the hole-free ortho crop over the C-12 Oryx's ground
# footprint at the cruise AGL (2 * AGL * tan(fov/2) per axis, ~258 x 194 m at
# 3,000 ft), rendered at the sensor's native 2048x1536. The warp is
# orthographic and pixel->world stays on the ortho projector.
base: citynav.yaml
# Far above any real flight: the effective episode bound is the wall-clock
# timeout, not this count.
max_steps: 100000
# A seeded uniform start over the tile bounds, deterministic per
# (spawn_seed, episode_id).
spawn: uniform
spawn_seed: 1234
# Every episode starts at 3,000 ft AGL.
start_altitude_agl_m: 914.4
altitude_cap_m: 1000.0
# The C-12's camera: Oryx ORX-32 + 25 mm, 16.1 x 12.1 deg, 2048x1536, nadir.
sensor: oryx_orx32_25mm_nadir

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" width="1400" height="300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The model writes a block of Python, the block reads or extends the world-state graph, and the result returns to the model for its next step.</title>
  <style>
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .card { fill: none; stroke: #656c76; stroke-width: 2; }
    .wire { fill: none; stroke: #4493f8; stroke-width: 2.5; }
    .head { fill: #4493f8; }
    .model { fill: #1f6feb; }
    .on-blue { fill: #ffffff; }
    .step { fill: none; stroke: #4493f8; stroke-width: 2.5; }
    .step-on { fill: #1f6feb; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 24px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <!-- the model -->
  <rect x="4" y="74" width="176" height="64" rx="10" class="model"/>
  <text x="92" y="116" text-anchor="middle" font-size="28" font-weight="700" class="on-blue">Model</text>
  <path d="M180,106 H280" class="wire" marker-end="url(#arrow)"/>

  <!-- the blocks it wrote, at the steps they were written -->
  <g class="code">
    <rect x="230" y="16" width="14" height="40" fill="#4c7bc0"/>
    <text x="282" y="44" text-anchor="end" font-size="20" class="muted">1</text>
    <rect x="290" y="14" width="648" height="44" rx="7" class="card"/>
    <text x="302" y="44" class="ink">norfolk = <tspan font-weight="700">find</tspan>("Norfolk Street")</text>

    <rect x="230" y="64" width="14" height="40" fill="#16896a"/>
    <text x="282" y="92" text-anchor="end" font-size="20" class="muted">4</text>
    <rect x="290" y="62" width="648" height="44" rx="7" class="card"/>
    <text x="302" y="92" class="ink">cars_pass = <tspan font-weight="700">explore</tspan>(norfolk)</text>

    <rect x="230" y="112" width="14" height="40" fill="#e3a230"/>
    <text x="282" y="140" text-anchor="end" font-size="20" class="muted">10</text>
    <rect x="290" y="110" width="648" height="44" rx="7" class="card"/>
    <text x="302" y="140" class="ink"><tspan font-weight="700">look</tspan>(grp, marks=norfolk)</text>

    <rect x="230" y="160" width="14" height="40" fill="#16896a"/>
    <text x="282" y="188" text-anchor="end" font-size="20" class="muted">13</text>
    <rect x="290" y="158" width="648" height="44" rx="7" class="card"/>
    <text x="302" y="188" class="ink"><tspan font-weight="700">go_to</tspan>(target)</text>
  </g>
  <path d="M938,106 H1186" class="wire" marker-end="url(#arrow)"/>

  <!-- the world-state graph -->
  <path d="M1198,34 V176 A97,18 0 0 0 1392,176 V34" class="card" style="stroke:#4493f8;stroke-width:2.5"/>
  <ellipse cx="1295" cy="34" rx="97" ry="18" class="card" style="stroke:#4493f8;stroke-width:2.5"/>
  <text x="1295" y="112" text-anchor="middle" font-size="32" class="ink">World-state</text>
  <text x="1295" y="150" text-anchor="middle" font-size="32" class="ink">graph</text>

  <!-- the thirteen steps -->
  <g font-size="24" text-anchor="middle">
    <circle cx="260" cy="226" r="20" class="step-on"/><text x="260" y="234.5" font-weight="700" class="on-blue">1</text>
    <circle cx="332" cy="226" r="20" class="step"/><text x="332" y="234.5" class="ink">2</text>
    <circle cx="404" cy="226" r="20" class="step"/><text x="404" y="234.5" class="ink">3</text>
    <circle cx="476" cy="226" r="20" class="step-on"/><text x="476" y="234.5" font-weight="700" class="on-blue">4</text>
    <circle cx="548" cy="226" r="20" class="step"/><text x="548" y="234.5" class="ink">5</text>
    <circle cx="620" cy="226" r="20" class="step"/><text x="620" y="234.5" class="ink">6</text>
    <circle cx="692" cy="226" r="20" class="step"/><text x="692" y="234.5" class="ink">7</text>
    <circle cx="764" cy="226" r="20" class="step"/><text x="764" y="234.5" class="ink">8</text>
    <circle cx="836" cy="226" r="20" class="step"/><text x="836" y="234.5" class="ink">9</text>
    <circle cx="908" cy="226" r="20" class="step-on"/><text x="908" y="234.5" font-weight="700" class="on-blue">10</text>
    <circle cx="980" cy="226" r="20" class="step"/><text x="980" y="234.5" class="ink">11</text>
    <circle cx="1052" cy="226" r="20" class="step"/><text x="1052" y="234.5" class="ink">12</text>
    <circle cx="1124" cy="226" r="20" class="step-on"/><text x="1124" y="234.5" font-weight="700" class="on-blue">13</text>
  </g>

  <!-- the result returns for the next step -->
  <path d="M1295,194 V264 Q1295,272 1287,272 H1272" class="wire"/>
  <text x="1194" y="281" text-anchor="middle" font-size="28" class="ink">Next step</text>
  <path d="M1116,272 H100 Q92,272 92,264 V140" class="wire" marker-end="url(#arrow)"/>
</svg>

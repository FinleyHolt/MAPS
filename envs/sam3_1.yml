# sam3_1: the SAM 3.1 segmentation serve env (python -m serving.sam_server).
#
# Kept apart from the bench env: `sam3` requires numpy<2, while the bench's
# tifffile requires numpy>=2.1. The two talk over SAM_SERVER_URL.
#
# SAM 3.1 itself (`sam3`, imported by serving/sam_engine.py) is not on PyPI:
# install it from Meta's SAM 3 source into this env. The checkpoint is gated
# on Hugging Face (facebook/sam3.1): approve it, export HF_TOKEN, and the
# engine fetches it on first load (or point SAM3_CHECKPOINT at a local file).
#
#   micromamba env create -f envs/sam3_1.yml
#   micromamba activate sam3_1
#   pip install <SAM 3 source checkout>
#   python -m serving.sam_server --port 8772     # from the repo root
name: sam3_1
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.3
      - torchvision
      - transformers>=5.2
      - huggingface_hub
      - numpy<2
      - pillow
      - opencv-python-headless>=4.8
      - fastapi==0.139.0
      - starlette>=0.49.1
      - uvicorn==0.50.2
      - pydantic==2.13.4
